name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Test brightness controls
        run: make test

      - name: Build universal app archive
        run: make release

      - name: Verify app and archive
        run: |
          archs=$(lipo -archs "build/Brightness Unlock.app/Contents/MacOS/BrightnessUnlock")
          for arch in arm64 x86_64; do
            case " $archs " in
              *" $arch "*) ;;
              *) echo "Missing architecture: $arch" >&2; exit 1 ;;
            esac
          done
          codesign --verify --deep --strict "build/Brightness Unlock.app"
          ditto -x -k "build/Brightness-Unlock.zip" "$RUNNER_TEMP/verify"
          test -x "$RUNNER_TEMP/verify/Brightness Unlock.app/Contents/MacOS/BrightnessUnlock"
          codesign --verify --deep --strict "$RUNNER_TEMP/verify/Brightness Unlock.app"
          cd build && shasum -a 256 -c Brightness-Unlock.zip.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Brightness-Unlock-${{ github.sha }}
          path: build/Brightness-Unlock.zip
          if-no-files-found: error
          archive: false

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.sh
